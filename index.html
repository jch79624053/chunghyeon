<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충현 Manager</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#182638;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#fff;border-right:1px solid #e1e7ef;padding:24px 15px;flex-shrink:0}.brand{font-size:22px;font-weight:800;color:#2356a4;margin:0 10px 28px}.brand small{display:block;font-size:11px;color:#8090a3;font-weight:500;margin-top:5px}.nav{width:100%;border:0;background:none;text-align:left;border-radius:10px;padding:13px 15px;color:#536579;margin:3px 0}.nav.active{background:#e9f1ff;color:#225ab2;font-weight:700}.main{flex:1;min-width:0;padding:30px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:23px}.top h1{font-size:25px;margin:0}.muted{color:#718096;font-size:13px}.pill{border-radius:50px;padding:7px 12px;background:#e7f6ed;color:#167145;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e3e9f0;border-radius:13px;padding:19px}.card .value{font-size:27px;font-weight:800;margin-top:11px}.panel{margin-top:18px}.panel h2{font-size:17px;margin:0 0 16px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.primary{border:0;background:#2563c9;color:#fff;border-radius:8px;padding:10px 14px;font-weight:650}.secondary{background:#fff;border:1px solid #d7e0eb;color:#33506f;border-radius:8px;padding:8px 11px}.danger{color:#c13c42}.good{color:#18845a}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#718096;font-weight:600;font-size:12px;background:#f7f9fc}th,td{padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}tr:last-child td{border:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}.field input,.field select{padding:10px;border:1px solid #d5dfe9;border-radius:8px;min-width:0;background:white}.field.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{padding:12px;background:#fff8e6;border-radius:9px;color:#85601c;font-size:12px;margin:12px 0}.empty{padding:25px;text-align:center;color:#8591a1}.tag{font-size:11px;padding:5px 8px;border-radius:7px;background:#eef3fa}.hide{display:none!important}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.sidebar{width:175px}.main{padding:18px}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.sidebar{width:100%;padding:12px;border-right:0;border-bottom:1px solid #e1e7ef}.brand{font-size:18px;margin:0 4px 10px}.brand small{display:none}.navs{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:9px 11px;font-size:13px}.main{padding:15px}.top h1{font-size:21px}.cards{gap:8px}.card{padding:12px}.card .value{font-size:22px}.panel{padding:13px}.formgrid{grid-template-columns:1fr}}
.ingredient-results{position:absolute;z-index:20;top:100%;left:0;right:0;max-height:220px;overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid #c8d7e8;border-radius:9px;box-shadow:0 8px 18px #1b35502b;margin-top:4px}.ingredient-results[hidden]{display:none}.ingredient-option{display:block;width:100%;border:0;border-bottom:1px solid #edf1f6;background:#fff;padding:12px;text-align:left;font-size:13px;color:#243b54}.ingredient-option:hover,.ingredient-option:focus{background:#e9f1ff}.ingredient-search{width:100%}
.login{max-width:420px;margin:8vh auto;background:white;border:1px solid #e3e9f0;border-radius:15px;padding:28px}.login h1{color:#2356a4}.login input{width:100%;padding:12px;border:1px solid #d5dfe9;border-radius:8px;margin:6px 0 14px}.login button{width:100%}.warn{background:#fff8e6;color:#78551b;padding:12px;border-radius:8px;font-size:13px}.secret{background:#f7f9fc;border:1px solid #dce5ef;border-radius:10px;padding:15px}.ingrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:8px 0}.ingrow input,.ingrow select{min-width:0;width:100%;padding:9px;border:1px solid #d5dfe9;border-radius:8px}.hidden{display:none!important}@media(max-width:650px){.ingrow{grid-template-columns:1fr 90px auto}}
button,.secondary,.primary,input,select{min-height:44px}input[type=checkbox]{min-height:24px;width:24px;vertical-align:middle}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #88b3ff;outline-offset:2px}.searchbox{padding:12px;border:1px solid #d5dfe9;border-radius:9px;width:100%;margin:10px 0 16px}.ingrow>div{min-width:0}.ingredient-filter{margin-bottom:5px}.help{font-size:13px;line-height:1.7;color:#536579}.metric-warn{color:#bc5d20}.analysis-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}.analysis-list h3{margin-top:0}.analysis-list dl{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:14px}.analysis-list dd{margin:0;text-align:right}.price-state{background:#fff8e6;color:#85601c;padding:5px 8px;border-radius:6px;display:inline-block}details{margin:12px 0}summary{cursor:pointer;min-height:44px;padding:10px 0}a{color:#2356a4}svg text{fill:#43546b}.login{width:calc(100% - 24px)}@media(min-width:601px) and (max-width:1100px){.app{display:block}.sidebar{width:100%;padding:16px 20px;border-bottom:1px solid #e1e7ef}.brand{margin:0 0 12px}.brand small{display:none}.navs{display:flex;gap:6px;overflow:auto}.nav{width:auto;white-space:nowrap}.main{padding:22px}.top{align-items:flex-start}.formgrid{gap:16px}}@media(max-width:600px){.top{flex-wrap:wrap}.top .actions{width:100%}.analysis-list{grid-template-columns:1fr}.ingrow{grid-template-columns:minmax(0,1fr) 82px auto}}
textarea{font:inherit;border:1px solid #d5dfe9;border-radius:8px;padding:12px;resize:vertical;width:100%;min-height:100px}</style></head><body>
<div id="login" class="login"><h1>충현 Manager</h1><p class="muted">매장 운영 계정으로 로그인하세요</p><form id="loginForm"><label class="field">이메일<input id="email" type="email" autocomplete="username" required></label><label class="field">비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">로그인</button></form><p id="loginMsg" class="muted" role="status"></p><button class="secondary" id="forgotBtn" type="button" style="width:100%;margin-bottom:14px">비밀번호를 잊으셨나요?</button><div id="forgotPanel" class="hidden"><p class="muted">위 이메일 주소로 비밀번호 변경 링크를 보냅니다.</p><button class="primary" id="sendReset" type="button" style="width:100%">재설정 이메일 보내기</button><p id="resetRequestMsg" class="muted" role="status"></p></div><details><summary>대표자 최초 계정 등록</summary><p class="help">위 이메일과 비밀번호를 입력하고 아래에서 비밀번호를 확인하세요. 지정된 대표자 이메일만 관리 권한을 받을 수 있습니다.</p><label class="field">비밀번호 확인<input id="signupConfirm" type="password" autocomplete="new-password" minlength="8"></label><button class="secondary" id="signupBtn" type="button">대표자 계정 등록</button><p id="signupMsg" class="help" role="status"></p></details><div class="warn">직원은 초대받은 계정으로 접속합니다. 대표자 최초 등록 후 이메일 인증이 필요합니다.</div></div>
<div id="recovery" class="login hidden"><h1>비밀번호 설정</h1><p class="muted">이메일로 받은 초대 또는 비밀번호 재설정 링크로 접속했습니다.</p><form id="recoveryForm"><label class="field">새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="field">새 비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">비밀번호 변경</button></form><p id="recoveryMsg" class="muted" role="status"></p></div><div class="app hidden" id="app"><aside class="sidebar"><div class="brand">충현 Manager<small>매장 원가 · 레시피 관리</small></div><div class="navs"><button class="nav active" data-page="dashboard">▦ 대시보드</button><button class="nav" data-page="materials">▣ 원자재</button><button class="nav" data-page="recipes">▤ 레시피</button><button class="nav" data-page="secret">🔒 비밀 레시피</button><button class="nav" data-page="analysis">◷ 수익 분석</button><button class="nav" data-page="prices">↗ 가격 확인</button><button class="nav" data-page="finance">◴ 월말 정산</button><button class="nav" data-page="access">👥 직원 관리</button></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">대시보드</h1><div class="muted">원자재 · 레시피 · 원가 관리</div></div><div class="actions"><span class="pill" id="status">연결 중</span><button class="secondary" id="reload">↻ 새로고침</button><button class="secondary" id="logout">로그아웃</button></div></div><div id="view"></div></main></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm';
import {renderFinanceUI} from './finance-ui.mjs';
import {base, priceUnit, safeLink, costs, analysis, priceChange, provider} from './core.mjs';
import {appConfig,validateConfig} from './app-config.mjs';
const {url:URL,publishableKey:KEY}=validateConfig(appConfig);
const supabase=createClient(URL,KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
let serverRecipeCosts={},serverSecretCosts={};
let page='dashboard', materials=[],recipes=[],items=[],history=[],secrets=[],secretItems=[],profile=null,currentUserId=null;
function matCost(id,amt){return costs(materials,recipes,items,secrets,secretItems).materialCost(id,amt)}
function secCost(id){return Object.hasOwn(serverSecretCosts,id)?serverSecretCosts[id]:costs(materials,recipes,items,secrets,secretItems).secretCost(id)}
function recipeCost(id){return Object.hasOwn(serverRecipeCosts,id)?serverRecipeCosts[id]:costs(materials,recipes,items,secrets,secretItems).recipeCost(id)}
function fmtCost(c){return c==null?'가격 확인 필요':won(Math.round(c))}
function fail(e){alert(e?.message||String(e))}
async function load(){
 $('#status').textContent='동기화 중';
 const {data,error}=await supabase.rpc('management_snapshot');
 if(error){$('#status').textContent='조회 오류';$('#view').innerHTML='<section class="panel"><h2>데이터를 불러오지 못했습니다.</h2><p class="help">연결 상태와 계정 권한을 확인한 뒤 새로고침해 주세요.</p></section>';throw error}
 [materials,recipes,items,history,secrets,secretItems]=['materials','recipes','recipe_items','material_price_history','secret_recipes','secret_recipe_items'].map(t=>data[t]||[]);
 serverRecipeCosts=data.recipe_costs||{};serverSecretCosts=data.secret_costs||{};
 $('#status').textContent='● 저장소 연결됨';render();
}
async function saveForm(form,work){if(form.dataset.busy)return;form.dataset.busy='1';const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await work()}catch(error){fail(error)}finally{delete form.dataset.busy;buttons.forEach(b=>b.disabled=false)}}
async function rpc(name,args){const response=await supabase.rpc(name,args);if(response.error)throw response.error;return response.data}
// 직원은 원자재 가격·비밀 배합 테이블을 조회하지 않습니다.
let staffRecipeData=[];
async function loadStaffRecipes(){
 $('#status').textContent='레시피 조회 중';
 const {data,error}=await supabase.rpc('staff_recipe_view');
 if(error){$('#status').textContent='조회 준비 필요';$('#view').innerHTML=`<section class="panel"><h2>직원 레시피</h2><div class="note">직원 레시피를 불러오지 못했습니다. 연결 상태를 확인한 뒤 새로고침해 주세요.</div><p class="muted">${esc(error.message)}</p></section>`;return}
 staffRecipeData=Array.isArray(data)?data:[];
 $('#status').textContent='● 직원 레시피 연결됨';renderStaffRecipes();
}
function renderStaffRecipes(){
 const v=$('#view');if(!v)return;
 v.innerHTML=`<section class="panel"><h2>일반 레시피</h2><p class="muted">조리용 재료와 사용량을 표시합니다. 비밀 배합은 별도 승인된 계정에만 표시하며 구매가와 원가는 공개하지 않습니다.</p>
 ${staffRecipeData.map(r=>`<div class="secret" style="margin:12px 0"><b>${esc(r.name)}</b><p class="help" style="white-space:pre-wrap">${esc(r.instructions||'')}</p>${(r.ingredients||[]).map(i=>`<p>${esc(i.name)} · ${esc(i.amount)} ${esc(i.unit||'')}</p>`).join('')||'<p class="muted">등록된 재료가 없습니다.</p>'}</div>`).join('')||'<div class="empty">등록된 일반 레시피가 없습니다.</div>'}</section>`;
}
async function check(){
 profile=null;materials=[];recipes=[];items=[];history=[];secrets=[];secretItems=[];staffRecipeData=[];serverRecipeCosts={};serverSecretCosts={};

 let {data:{user},error}=await supabase.auth.getUser();
 if(error||!user){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');return}
 await rpc('activate_owner',{});
 const p=await supabase.from('staff_profiles').select('role,active,secret_access').eq('user_id',user.id).maybeSingle();
 if(p.error||!p.data?.active||!['owner','manager','staff'].includes(p.data.role)){
  await supabase.auth.signOut();$('#loginMsg').textContent='사용 가능한 직원 계정이 아닙니다. 대표자에게 확인해 주세요.';
  $('#app').classList.add('hidden');$('#login').classList.remove('hidden');return
 }
 profile=p.data;currentUserId=user.id;
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
 if(profile.role==='owner'||profile.role==='manager'){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('hidden',(b.dataset.page==='access'&&profile.role!=='owner')||(b.dataset.page==='secret'&&!profile.secret_access&&profile.role!=='owner')));
  if(page==='access'&&profile.role!=='owner')page='dashboard';
  await load();if(profile.role==='owner')await fetchStaff();return;
 }
 // 일반 직원은 RPC만 사용하며 원가 데이터가 담긴 테이블을 요청하지 않습니다.
 page='staffrecipes';
 document.querySelectorAll('.nav').forEach(b=>b.classList.add('hidden'));
 $('#pageTitle').textContent='직원 레시피';
 await loadStaffRecipes();
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  $('#loginMsg').textContent='로그인 중...';
  const {error}=await supabase.auth.signInWithPassword({
    email:$('#email').value.trim(),
    password:$('#password').value
  });
  if(error){
    $('#loginMsg').textContent=error.code==='invalid_credentials'?'이메일 또는 비밀번호를 확인해 주세요.':error.code==='email_not_confirmed'?'이메일 인증을 완료한 뒤 로그인해 주세요.':'로그인하지 못했습니다. '+error.message;
    return;
  }
  $('#password').value='';
  $('#loginMsg').textContent='';
  await check();
};
// GitHub Pages의 고정 주소. 사이트 게시 후 Supabase Authentication > URL Configuration에 등록해야 합니다.
const SITE_URL='https://jch79624053.github.io/chunghyeon/';
let recoveryMode=(location.hash.includes('type=recovery') || location.hash.includes('type=invite')) || ['recovery','invite'].includes(new URLSearchParams(location.search).get('type'));
function showRecovery(){recoveryMode=true;$('#app').classList.add('hidden');$('#login').classList.add('hidden');$('#recovery').classList.remove('hidden')}
$('#forgotBtn').onclick=()=>$('#forgotPanel').classList.toggle('hidden');
$('#sendReset').onclick=async()=>{
 const email=$('#email').value.trim(),msg=$('#resetRequestMsg');
 if(!email)return msg.textContent='먼저 이메일 주소를 입력해 주세요.';
 if(location.protocol==='file:'||location.protocol==='content:')return msg.textContent='GitHub Pages 사이트에서 접속한 뒤 요청해 주세요.';
 msg.textContent='이메일 전송 중...';
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});
 msg.textContent=error?('요청 오류: '+error.message):'재설정 이메일을 요청했습니다. 메일함을 확인해 주세요. (메일이 오지 않으면 잠시 후 확인하세요.)';
};
supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery();if(event==='SIGNED_OUT'){profile=null;materials=[];recipes=[];items=[];history=[];secrets=[];secretItems=[];staffRecipeData=[];serverRecipeCosts={};serverSecretCosts={};$('#view').replaceChildren();$('#app').classList.add('hidden');if(!recoveryMode)$('#login').classList.remove('hidden')}});
if(recoveryMode)showRecovery();
$('#recoveryForm').onsubmit=async e=>{
 e.preventDefault();const pw=$('#newPassword').value,msg=$('#recoveryMsg');
 if(pw!==$('#confirmPassword').value)return msg.textContent='두 비밀번호가 일치하지 않습니다.';
 msg.textContent='변경 중...';
 const {error}=await supabase.auth.updateUser({password:pw});
 if(error)return msg.textContent='변경 실패: '+error.message;
 msg.textContent='비밀번호가 변경되었습니다. 로그인 화면으로 이동합니다.';
 await supabase.auth.signOut();window.history.replaceState(null,'',location.pathname);recoveryMode=false;
 $('#recovery').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginMsg').textContent='새 비밀번호로 로그인해 주세요.';
};
$('#logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};$('#reload').onclick=()=>check().catch(fail);
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));if(page==='access'&&profile?.role==='owner')fetchStaff();$('#pageTitle').textContent={dashboard:'대시보드',materials:'원자재 관리',recipes:'레시피 관리',secret:'비밀 레시피',access:'직원 관리',analysis:'수익 분석',prices:'가격 확인',finance:'월말 정산'}[page];render()});
function render(){if(profile?.role==='staff'){renderStaffRecipes();return}const v=$('#view');if(page==='dashboard'){let valid=recipes.filter(r=>recipeCost(r.id)!=null&&r.selling_price>0);let avg=valid.length?valid.reduce((a,r)=>a+recipeCost(r.id)/r.selling_price*100,0)/valid.length:0;v.innerHTML=`<div class="cards"><div class="card"><div class="muted">등록 원자재</div><div class="value">${materials.length}개</div></div><div class="card"><div class="muted">등록 메뉴</div><div class="value">${recipes.length}개</div></div><div class="card"><div class="muted">평균 재료 원가율</div><div class="value">${avg.toFixed(1)}%</div></div><div class="card"><div class="muted">가격 기록</div><div class="value">${history.length}건</div></div></div><div class="grid2"><section class="panel"><h2>월별 원자재 구매가 추이</h2><select id="trendSelect" class="secondary">${materials.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div id="trendChart"></div></section><section class="panel"><h2>메뉴별 원가율</h2>${recipes.map(r=>`<p><b>${esc(r.name)}</b> · ${recipeCost(r.id)==null||!r.selling_price?'확인 필요':(recipeCost(r.id)/r.selling_price*100).toFixed(1)+'%'}<br><span class="muted">원가 ${fmtCost(recipeCost(r.id))} / 판매가 ${won(r.selling_price)}</span></p>`).join('')||'<p class="muted">등록된 레시피가 없습니다.</p>'}</section></div><div class="note">가격 확인 메뉴에서 구매 링크와 변동 기록을 확인할 수 있습니다. 확인된 구매가를 저장하면 메뉴 원가가 다시 계산됩니다.</div>`;$('#trendSelect').onchange=e=>trend(+e.target.value);trend(+$('#trendSelect').value);return}

function trend(id){const el=$('#trendChart');if(!el)return;const m=materials.find(x=>x.id===id);if(!m){el.innerHTML='<p class="muted">원자재를 등록해 주세요.</p>';return}let by=new Map();priceChange(history,id).rows.forEach(h=>by.set(h.recorded_at.slice(0,7),Number(h.price)));let a=[...by].slice(-12);if(!a.length){el.innerHTML='<p class="muted">기록된 가격이 없습니다.</p>';return}let lo=Math.min(...a.map(x=>x[1])),hi=Math.max(...a.map(x=>x[1]));if(lo===hi){const pad=Math.max(Math.abs(lo)*.2,1);lo-=pad;hi+=pad}let pts=a.map((x,i)=>({x:a.length===1?170:30+i*280/(a.length-1),y:150-(x[1]-lo)/(hi-lo)*110,label:x[0].slice(2),p:x[1]}));el.innerHTML=`<svg viewBox="0 0 340 190" style="width:100%;max-height:260px"><line x1="20" y1="150" x2="325" y2="150" stroke="#cbd5e1"/><polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#2563eb" stroke-width="3"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#2563eb"/><text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="10">${p.p.toLocaleString()}</text><text x="${p.x}" y="170" text-anchor="middle" font-size="10">${p.label}</text>`).join('')}</svg>`}
function matForm(id){const m=materials.find(x=>x.id===id)||{};$('#editor').innerHTML=`<div class="panel" style="background:#f8fbff"><h2>${id?'원자재 수정':'원자재 등록'}</h2><form id="matForm"><div class="formgrid"><label class="field">원자재 이름<input name="name" required value="${esc(m.name||'')}"></label><label class="field">구매처<input name="vendor" value="${esc(m.vendor||'')}"></label><label class="field">구매가(원) · 미확인 시 비우기<input name="price" type="number" min="0" step="0.01" value="${m.purchase_price??''}"></label><label class="field">포장 수량<input name="qty" type="number" min="0.001" step="any" value="${m.purchase_quantity??''}"></label><label class="field">단위<select name="unit">${['g','kg','ml','L','개'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="field">구매 링크<input name="url" type="url" value="${esc(m.purchase_url||'')}"></label></div><div class="actions"><button class="primary">저장</button><button type="button" class="secondary" id="cancel">취소</button></div></form></div>`;$('#cancel').onclick=render;$('#matForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=f.get('price'),q=f.get('qty');const row={name:String(f.get('name')).trim(),vendor:String(f.get('vendor')).trim()||null,purchase_url:String(f.get('url')).trim()||null,purchase_price:p===''?null:Number(p),purchase_quantity:q===''?null:Number(q),unit:f.get('unit'),updated_at:new Date().toISOString()};if(row.purchase_price!=null&&!(row.purchase_quantity>0))return alert('구매가가 있으면 포장 수량도 입력해 주세요.');if(row.purchase_url&&!safeLink(row.purchase_url))return alert('구매 링크는 http 또는 https 주소를 입력해 주세요.');await saveForm(e.target,async()=>{await rpc('save_material',{p_id:id??null,p_row:row,p_expected:m.updated_at??null});await load()})}}

function wireRows(host,secret=false){host.querySelectorAll('.ingselect').forEach(select=>{if(select.previousElementSibling?.classList.contains('ingredient-filter'))return;const search=document.createElement('input');search.type='search';search.placeholder='재료 이름 검색';search.className='ingredient-filter';search.setAttribute('aria-label','재료 이름 검색');const wrap=document.createElement('div');select.before(wrap);wrap.append(search,select);search.oninput=()=>{const term=search.value.trim().toLowerCase();for(const option of select.options)option.hidden=!!term&&!option.selected&&!option.text.toLowerCase().includes(term)}});host.querySelectorAll('.rm').forEach(b=>b.onclick=()=>b.closest('.ingrow').remove());const add=host.parentElement.querySelector('.addIng');if(add)add.onclick=()=>{host.insertAdjacentHTML('beforeend',rowHtml({},secret));wireRows(host,secret)}}
function collectRows(){return [...document.querySelectorAll('.ingrow')].map(el=>{const [type,id]=el.querySelector('select').value.split(':');return {material_id:type==='m'?Number(id):null,secret_recipe_id:type==='s'?Number(id):null,amount:Number(el.querySelector('.amount').value)}})}
function recipeForm(id){const r=recipes.find(x=>x.id===id)||{},ri=items.filter(x=>x.recipe_id===id);$('#editor').innerHTML=`<div class="panel" style="background:#f8fbff"><h2>${id?'레시피 수정':'레시피 추가'}</h2><form id="rForm"><div class="formgrid"><label class="field">메뉴 이름<input name="name" required value="${esc(r.name||'')}"></label><label class="field">판매가<input name="price" type="number" min="0" required value="${r.selling_price??''}"></label></div><label class="field" style="margin-top:12px">조리 순서·주의사항<textarea name="instructions" maxlength="10000" rows="4">${esc(r.instructions||'')}</textarea></label><h3>재료 및 사용량</h3><p class="muted">원자재는 g/ml/개, 비밀 제조 재료는 생산량 단위로 입력하세요.</p><div id="rows">${ri.map(x=>rowHtml(x)).join('')}</div><button class="secondary addIng" type="button">+ 재료 추가</button><div class="actions"><button class="primary">레시피 저장</button><button class="secondary" id="cancel" type="button">취소</button></div></form></div>`;wireRows($('#rows'));$('#cancel').onclick=render;$('#rForm').onsubmit=async e=>{e.preventDefault();let rows=collectRows();if(!rows.length||rows.some(x=>!(x.amount>0)||(!x.material_id&&!x.secret_recipe_id)))return alert('재료와 사용량을 확인해 주세요.');const f=new FormData(e.target),payload={name:String(f.get('name')).trim(),selling_price:Number(f.get('price'))};payload.instructions=String(f.get('instructions')||'');await saveForm(e.target,async()=>{await rpc('save_recipe',{p_id:id??null,p_row:payload,p_items:rows,p_secret:false,p_expected:r.updated_at??null});await load()})}}
function secretForm(id){const s=secrets.find(x=>x.id===id)||{},si=secretItems.filter(x=>x.secret_recipe_id===id);$('#editor').innerHTML=`<div class="panel" style="background:#f8fbff"><h2>${id?'비밀 레시피 수정':'비밀 레시피 추가'}</h2><form id="sForm"><div class="formgrid"><label class="field">제조 재료 이름<input name="name" required value="${esc(s.name||'')}"></label><label class="field">생산량<input name="yield" type="number" min="0.001" step="any" required value="${s.yield_quantity??''}"></label><label class="field">생산 단위<select name="unit">${['g','ml','개'].map(u=>`<option ${s.yield_unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div><label class="field" style="margin-top:12px">제조 순서·주의사항<textarea name="instructions" maxlength="10000" rows="4">${esc(s.instructions||'')}</textarea></label><h3>비밀 배합</h3><div id="rows">${si.map(x=>rowHtml(x,true)).join('')}</div><button class="secondary addIng" type="button">+ 재료 추가</button><div class="actions"><button class="primary">비밀 레시피 저장</button><button class="secondary" type="button" id="cancel">취소</button></div></form></div>`;wireRows($('#rows'),true);$('#cancel').onclick=render;$('#sForm').onsubmit=async e=>{e.preventDefault();const rows=collectRows();if(!rows.length||rows.some(x=>!x.material_id||!(x.amount>0)))return alert('재료와 사용량을 확인해 주세요.');const f=new FormData(e.target),payload={name:String(f.get('name')).trim(),yield_quantity:Number(f.get('yield')),yield_unit:f.get('unit')};payload.instructions=String(f.get('instructions')||'');await saveForm(e.target,async()=>{await rpc('save_recipe',{p_id:id??null,p_row:payload,p_items:rows,p_secret:true,p_expected:s.updated_at??null});await load()})}}

async function renderFinancePage(){const host=$('#view');host.innerHTML='<section class="panel">정산 자료를 불러오는 중입니다...</section>';try{const snapshot=await rpc('finance_snapshot',{});if(page!=='finance')return;renderFinanceUI({host,snapshot,profile,staffProfiles,rpc,reload:renderFinancePage,esc,won})}catch(error){if(page!=='finance')return;host.innerHTML=`<section class="panel"><h2>월말 정산</h2><p class="help">${esc(error.message)}</p></section>`}}
let analysisSettings={target:30,fee:0,other:0};
function renderAnalysis(){
 if(!['owner','manager'].includes(profile?.role))return;
 $('#view').innerHTML=`<section class="panel"><h2>메뉴별 수익 분석</h2><p class="help">현재 구매가와 레시피 사용량을 기준으로 계산합니다. 예상 기여이익은 판매가에서 재료비·수수료·메뉴당 기타비용을 뺀 금액입니다. 임대료·인건비·세금 등을 모두 반영한 순이익은 아닙니다.</p><form id="analysisForm" class="formgrid"><label class="field">목표 재료 원가율 (%)<input name="target" type="number" min="0.1" max="100" step="0.1" required value="${analysisSettings.target}"></label><label class="field">매출 수수료 (%)<input name="fee" type="number" min="0" max="99.9" step="0.1" required value="${analysisSettings.fee}"></label><label class="field">메뉴당 기타비용 (원)<input name="other" type="number" min="0" step="1" required value="${analysisSettings.other}"></label><div class="actions"><button class="primary">분석 적용</button></div></form><p class="muted">분석 조건은 이번 접속에서만 적용됩니다. 적정 판매가는 목표 재료 원가율 기준으로 100원 단위 올림하며, 실제 판매가는 변경하지 않습니다.</p><div id="analysisResults"></div></section>`;
 const draw=()=>{$('#analysisResults').innerHTML=`<div class="analysis-list">${recipes.map(recipe=>{const c=recipeCost(recipe.id),a=analysis(c,recipe.selling_price,analysisSettings.target,analysisSettings.fee,analysisSettings.other);return `<article class="secret"><h3>${esc(recipe.name)}</h3>${a?`<dl><dt>판매가</dt><dd>${won(recipe.selling_price)}</dd><dt>재료 원가</dt><dd>${fmtCost(c)}</dd><dt>재료 원가율</dt><dd class="${a.ratio>analysisSettings.target?'metric-warn':'good'}">${a.ratio.toFixed(1)}%</dd><dt>예상 기여이익</dt><dd class="${a.contribution<0?'danger':'good'}">${won(Math.round(a.contribution))}</dd><dt>기여이익률</dt><dd>${a.margin.toFixed(1)}%</dd><dt>목표 원가율 판매가</dt><dd>${won(a.recommended)}</dd><dt>변동비 충당 판매가</dt><dd>${won(a.breakEven)}</dd></dl>`:'<p class="price-state">가격·판매가·배합 확인 필요</p><p class="help">재료 가격 또는 접근 가능한 배합 정보가 부족하면 이익을 추정하지 않습니다.</p>'}</article>`}).join('')||'<p class="empty">등록된 메뉴가 없습니다.</p>'}</div>`};
 $('#analysisForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);analysisSettings={target:Number(f.get('target')),fee:Number(f.get('fee')),other:Number(f.get('other'))};draw()};draw();
}
function renderPrices(){
 if(!['owner','manager'].includes(profile?.role))return;
 $('#view').innerHTML=`<section class="panel"><h2>구매가 확인과 변동 기록</h2><p class="help">구매 링크에서 동일한 옵션·포장 수량·배송비·할인 조건을 확인한 뒤 구매가를 입력하세요. 확인되지 않은 온라인 가격은 자동으로 원가에 반영하지 않습니다.</p><div class="note">그램원 공개 상품 페이지는 가격 후보를 자동 조회합니다. 쿠팡·네이버와 조회가 불확실한 상품은 구매 링크에서 직접 확인합니다. 후보 가격은 검토 전까지 원가에 반영되지 않습니다.</div><input id="priceSearch" class="searchbox" type="search" placeholder="원자재·구매처 검색" aria-label="가격 확인 목록 검색"><div class="tablewrap"><table><thead><tr><th>원자재</th><th>구매처</th><th>현재 구매가</th><th>최근 기록 증감</th><th>마지막 가격 기록</th><th>작업</th></tr></thead><tbody>${materials.map(m=>{const change=priceChange(history,m.id);return `<tr><td><b>${esc(m.name)}</b><div class="muted">${esc(m.purchase_quantity??'미입력')} ${esc(m.unit||'')} / ${provider(m.purchase_url)}</div></td><td>${esc(m.vendor||'-')}</td><td>${m.purchase_price==null?'<span class="price-state">확인 필요</span>':won(m.purchase_price)}</td><td>${change.percent==null?'비교 기록 부족':`<span class="${change.percent>0?'danger':'good'}">${change.percent>0?'+':''}${change.percent.toFixed(1)}%</span>`}</td><td>${change.latest?esc(new Date(change.latest.recorded_at).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul'})):'기록 없음'}</td><td>${safeLink(m.purchase_url)?`<a class="secondary" target="_blank" rel="noopener noreferrer" href="${esc(safeLink(m.purchase_url))}">구매처 열기 ↗</a>`:''} <button class="secondary priceEdit" data-id="${m.id}">구매가 입력</button> <button class="secondary priceHistory" data-id="${m.id}">기록</button> <button class="secondary priceFetch" data-id="${m.id}">가격 조회</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">등록된 원자재가 없습니다.</td></tr>'}</tbody></table></div><div id="priceLookupResult" role="status"></div><div id="priceDetails"></div><div id="recentChecks"></div></section><section class="panel"><h2>자동 조회 검토 결과</h2><details><summary>네이버</summary><p class="help">네이버 개발자센터의 쇼핑 검색 API는 2026년 7월 31일 종료됐습니다. 종료된 API로 자동 조회를 구현하지 않습니다. 판매자가 승인한 데이터 제공 방법이 확인되기 전에는 구매 링크에서 직접 확인합니다. <a href="https://developers.naver.com/notice/article/32564" target="_blank" rel="noopener noreferrer">공식 공지</a></p></details><details><summary>쿠팡</summary><p class="help">확인한 Open API는 판매자 상품·주문 관리용입니다. 임의 구매 링크의 실제 결제가격을 무료로 조회할 수 있는지 별도 승인이 필요합니다. 회원가·쿠폰·옵션·배송비가 달라질 수 있어 확인되지 않은 값을 구매가로 저장하지 않습니다. <a href="https://developers.coupang.com/ko" target="_blank" rel="noopener noreferrer">공식 개발자 문서</a></p></details><details><summary>그램원</summary><p class="help">이번 조사에서 공개 상품 페이지의 단일 원화 판매가를 조회하는 방식을 구현했습니다. 판매처의 robots 제한을 확인하고 로그인·차단 우회 없이 조회합니다. 옵션·재고·배송비·할인은 직접 확인해야 합니다. 조회가 차단되거나 모호하면 수동 확인으로 전환합니다.</p></details><p class="muted">최근 결과를 재사용해 반복 요청을 줄입니다. 로그인 우회·차단 우회·브라우저에 비밀 키 저장은 사용하지 않습니다.</p></section>`;
 $('#priceSearch').oninput=e=>{const term=e.target.value.trim().toLowerCase();document.querySelectorAll('#view tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(term))};
 document.querySelectorAll('.priceEdit').forEach(b=>b.onclick=()=>{page='materials';$('#pageTitle').textContent='원자재 관리';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));render();matForm(Number(b.dataset.id));$('#editor').scrollIntoView({behavior:'smooth',block:'start'})});
 document.querySelectorAll('.priceFetch').forEach(button=>button.onclick=async()=>{
  const id=Number(button.dataset.id),material=materials.find(m=>m.id===id),result=$('#priceLookupResult');button.disabled=true;result.textContent='가격을 확인하는 중입니다...';
  try{const {data,error}=await supabase.functions.invoke('price-lookup',{body:{material_id:id}});if(error){let message=error.message;try{message=(await error.context.json()).error||message}catch{}throw new Error(message)}if(!data?.ok)throw new Error(data?.error||'조회 결과를 확인할 수 없습니다.');result.innerHTML=`<section class="secret" style="margin-top:14px"><h3>${esc(material.name)} 조회 결과</h3><p>${esc(data.message||'조회가 진행 중입니다. 잠시 후 다시 확인하세요.')}</p>${data.status==='candidate'?`<p><b>${esc(data.product_name)}</b> · 기본가 후보 <b>${won(data.price)}</b></p><p class="help">구매 옵션·포장 수량·배송비·할인 조건을 확인하세요. 버튼을 누르면 수정 폼에 후보 가격이 채워지며, 저장 전까지 구매가는 바뀌지 않습니다.</p><button id="useCandidate" class="primary">후보 가격으로 수정 폼 열기</button>`:''}<p class="muted">${data.cached?'최근 조회 결과 재사용 · ':''}구매가 자동 변경 없음</p></section>`;
  if(data.status==='candidate')$('#useCandidate').onclick=()=>{if(data.material_version!==material.updated_at){alert('원자재가 변경됐습니다. 새로고침 후 다시 조회하세요.');return}page='materials';$('#pageTitle').textContent='원자재 관리';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));render();matForm(id);$('#matForm').elements.namedItem('price').value=String(data.price);$('#matForm').insertAdjacentHTML('afterbegin','<label class="note" style="display:block"><input type="checkbox" required> 동일 상품·포장 수량·옵션·배송비를 확인했습니다.</label>');$('#editor').scrollIntoView({behavior:'smooth',block:'start'})};
  }catch(error){result.textContent='조회 실패: '+error.message+' 구매 링크에서 직접 확인할 수 있습니다.'}finally{button.disabled=false}
 });
 supabase.from('price_checks').select('material_id,status,price,message,checked_at').order('checked_at',{ascending:false}).limit(20).then(({data,error})=>{if(page!=='prices'||!$('#recentChecks')||error)return;$('#recentChecks').innerHTML=`<details><summary>최근 온라인 조회 기록</summary>${(data||[]).map(c=>`<p class="help"><b>${esc(materials.find(m=>m.id===c.material_id)?.name||'원자재')}</b> · ${c.status==='candidate'?won(c.price)+' 후보':esc(c.message||'조회 중')} · ${esc(new Date(c.checked_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))}</p>`).join('')||'<p class="muted">조회 기록이 없습니다.</p>'}</details>`});
 document.querySelectorAll('.priceHistory').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id),m=materials.find(m=>m.id===id),data=priceChange(history,id);$('#priceDetails').innerHTML=`<div class="panel"><h2>${esc(m?.name)} 가격 기록</h2><p class="muted">각 기록의 포장 수량과 단위를 함께 확인하세요. 포장 구매가 그래프는 각 월 마지막 가격 기록을 표시하며 포장 규격이 달라지면 단순 비교할 수 없습니다.</p><div id="trendChart"></div><div class="tablewrap"><table><thead><tr><th>기록일</th><th>구매가</th><th>포장 수량</th></tr></thead><tbody>${data.rows.slice().reverse().map(r=>`<tr><td>${esc(new Date(r.recorded_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))}</td><td>${won(r.price)}</td><td>${esc(r.purchase_quantity??'-')} ${esc(r.unit||'')}</td></tr>`).join('')||'<tr><td colspan="2">가격 기록이 없습니다.</td></tr>'}</tbody></table></div></div>`;trend(id);$('#priceDetails').scrollIntoView({behavior:'smooth',block:'start'})});
}

$('#signupBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value,msg=$('#signupMsg'),btn=$('#signupBtn');if(!email||password.length<8||password!==$('#signupConfirm').value){msg.textContent='이메일과 8자 이상 비밀번호를 입력하고 비밀번호 확인을 맞춰 주세요.';return}btn.disabled=true;try{const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:SITE_URL}});if(error)throw error;$('#password').value='';$('#signupConfirm').value='';msg.textContent='등록을 요청했습니다. 인증 메일을 확인한 뒤 로그인해 주세요.';if(data.session)await check()}catch(error){msg.textContent=error.message}finally{btn.disabled=false}};
if(!recoveryMode)check().catch(fail);
