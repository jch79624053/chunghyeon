<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>충현 Manager · 직원 관리 v2.2</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#182638;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#fff;border-right:1px solid #e1e7ef;padding:24px 15px;flex-shrink:0}.brand{font-size:22px;font-weight:800;color:#2356a4;margin:0 10px 28px}.brand small{display:block;font-size:11px;color:#8090a3;font-weight:500;margin-top:5px}.nav{width:100%;border:0;background:none;text-align:left;border-radius:10px;padding:13px 15px;color:#536579;margin:3px 0}.nav.active{background:#e9f1ff;color:#225ab2;font-weight:700}.main{flex:1;min-width:0;padding:30px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:23px}.top h1{font-size:25px;margin:0}.muted{color:#718096;font-size:13px}.pill{border-radius:50px;padding:7px 12px;background:#e7f6ed;color:#167145;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e3e9f0;border-radius:13px;padding:19px}.card .value{font-size:27px;font-weight:800;margin-top:11px}.panel{margin-top:18px}.panel h2{font-size:17px;margin:0 0 16px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.primary{border:0;background:#2563c9;color:#fff;border-radius:8px;padding:10px 14px;font-weight:650}.secondary{background:#fff;border:1px solid #d7e0eb;color:#33506f;border-radius:8px;padding:8px 11px}.danger{color:#c13c42}.good{color:#18845a}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#718096;font-weight:600;font-size:12px;background:#f7f9fc}th,td{padding:12px;border-bottom:1px solid #edf0f4;font-size:13px}tr:last-child td{border:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}.field input,.field select{padding:10px;border:1px solid #d5dfe9;border-radius:8px;min-width:0;background:white}.field.wide{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.note{padding:12px;background:#fff8e6;border-radius:9px;color:#85601c;font-size:12px;margin:12px 0}.empty{padding:25px;text-align:center;color:#8591a1}.tag{font-size:11px;padding:5px 8px;border-radius:7px;background:#eef3fa}.hide{display:none!important}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.sidebar{width:175px}.main{padding:18px}.grid2{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.sidebar{width:100%;padding:12px;border-right:0;border-bottom:1px solid #e1e7ef}.brand{font-size:18px;margin:0 4px 10px}.brand small{display:none}.navs{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:9px 11px;font-size:13px}.main{padding:15px}.top h1{font-size:21px}.cards{gap:8px}.card{padding:12px}.card .value{font-size:22px}.panel{padding:13px}.formgrid{grid-template-columns:1fr}}
.ingredient-results{position:absolute;z-index:20;top:100%;left:0;right:0;max-height:220px;overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid #c8d7e8;border-radius:9px;box-shadow:0 8px 18px #1b35502b;margin-top:4px}.ingredient-results[hidden]{display:none}.ingredient-option{display:block;width:100%;border:0;border-bottom:1px solid #edf1f6;background:#fff;padding:12px;text-align:left;font-size:13px;color:#243b54}.ingredient-option:hover,.ingredient-option:focus{background:#e9f1ff}.ingredient-search{width:100%}
.login{max-width:420px;margin:8vh auto;background:white;border:1px solid #e3e9f0;border-radius:15px;padding:28px}.login h1{color:#2356a4}.login input{width:100%;padding:12px;border:1px solid #d5dfe9;border-radius:8px;margin:6px 0 14px}.login button{width:100%}.warn{background:#fff8e6;color:#78551b;padding:12px;border-radius:8px;font-size:13px}.secret{background:#f7f9fc;border:1px solid #dce5ef;border-radius:10px;padding:15px}.ingrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:8px 0}.ingrow input,.ingrow select{min-width:0;width:100%;padding:9px;border:1px solid #d5dfe9;border-radius:8px}.hidden{display:none!important}@media(max-width:650px){.ingrow{grid-template-columns:1fr 90px auto}}</style></head><body>
<div id="login" class="login"><h1>충현 Manager</h1><p class="muted">Supabase 연결 · 계정 로그인</p><form id="loginForm"><label class="field">이메일<input id="email" type="email" autocomplete="username" required></label><label class="field">비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">로그인</button></form><p id="loginMsg" class="muted" role="status"></p><button class="secondary" id="forgotBtn" type="button" style="width:100%;margin-bottom:14px">비밀번호를 잊으셨나요?</button><div id="forgotPanel" class="hidden"><p class="muted">위 이메일 주소로 비밀번호 변경 링크를 보냅니다. GitHub Pages에 게시한 뒤 사용해 주세요.</p><button class="primary" id="sendReset" type="button" style="width:100%">재설정 이메일 보내기</button><p id="resetRequestMsg" class="muted" role="status"></p></div><div class="warn">기존 데이터는 유지됩니다. 직원 계정은 대표자가 승인한 권한으로만 접근할 수 있습니다.</div></div>
<div id="recovery" class="login hidden"><h1>비밀번호 설정</h1><p class="muted">이메일로 받은 초대 또는 비밀번호 재설정 링크로 접속했습니다.</p><form id="recoveryForm"><label class="field">새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="field">새 비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="primary">비밀번호 변경</button></form><p id="recoveryMsg" class="muted" role="status"></p></div><div class="app hidden" id="app"><aside class="sidebar"><div class="brand">충현 Manager<small>Supabase · 직원 관리 v2.2</small></div><div class="navs"><button class="nav active" data-page="dashboard">▦ 대시보드</button><button class="nav" data-page="materials">▣ 원자재</button><button class="nav" data-page="recipes">▤ 레시피</button><button class="nav" data-page="secret">🔒 비밀 레시피</button><button class="nav" data-page="access">👥 직원 관리</button></div></aside><main class="main"><div class="top"><div><h1 id="pageTitle">대시보드</h1><div class="muted">실제 Supabase 저장 · 권한별 사용</div></div><div class="actions"><span class="pill" id="status">연결 중</span><button class="secondary" id="reload">↻ 새로고침</button><button class="secondary" id="logout">로그아웃</button></div></div><div id="view"></div></main></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://rkohydhhtpjojiohmjkl.supabase.co';
const KEY='sb_publishable_7A5NndeTkM5pWqHBMxXkew_B8wEPi2n';
const supabase=createClient(URL,KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';
let page='dashboard', materials=[],recipes=[],items=[],history=[],secrets=[],secretItems=[],profile=null,currentUserId=null;
const base=(n,u)=>Number(n)*(u==='kg'||u==='L'?1000:1);
function priceUnit(m){return m?.purchase_price!=null&&m?.purchase_quantity>0?Number(m.purchase_price)/base(m.purchase_quantity,m.unit):null}
function matCost(id,amt){const m=materials.find(x=>x.id===id),p=priceUnit(m);return p==null?null:p*Number(amt)}
function secCost(id){const s=secrets.find(x=>x.id===id);if(!s)return null;let total=0;for(const x of secretItems.filter(i=>i.secret_recipe_id===id)){let c=matCost(x.material_id,x.amount);if(c==null)return null;total+=c}return total}
function recipeCost(id){let total=0;for(const x of items.filter(i=>i.recipe_id===id)){let c;if(x.material_id!=null)c=matCost(x.material_id,x.amount);else{const s=secrets.find(t=>t.id===x.secret_recipe_id),sc=secCost(x.secret_recipe_id);c=s&&sc!=null?sc/Number(s.yield_quantity)*Number(x.amount):null}if(c==null)return null;total+=c}return total}
function fmtCost(c){return c==null?'가격 확인 필요':won(Math.round(c))}
function fail(e){alert(e?.message||String(e))}
async function load(){ $('#status').textContent='동기화 중';const tables=['materials','recipes','recipe_items','material_price_history'];if(profile?.role==='owner'||(profile?.role==='manager'&&profile?.secret_access))tables.push('secret_recipes','secret_recipe_items');let result=await Promise.all(tables.map(t=>supabase.from(t).select('*').order('id')));let error=result.find(r=>r.error)?.error;if(error){$('#status').textContent='조회 오류';fail(error);return} const loaded=Object.fromEntries(tables.map((t,i)=>[t,result[i].data||[]]));[materials,recipes,items,history,secrets,secretItems]=['materials','recipes','recipe_items','material_price_history','secret_recipes','secret_recipe_items'].map(t=>loaded[t]||[]);$('#status').textContent='● Supabase 연결됨';render()}
// 직원은 원자재 가격·비밀 배합 테이블을 조회하지 않습니다.
let staffRecipeData=[];
async function loadStaffRecipes(){
 $('#status').textContent='레시피 조회 중';
 const {data,error}=await supabase.rpc('staff_recipe_view');
 if(error){$('#status').textContent='조회 준비 필요';$('#view').innerHTML=`<section class="panel"><h2>직원 레시피</h2><div class="note">직원용 보안 조회 함수가 아직 준비되지 않았습니다. 대표자에게 설정을 요청하세요.</div><p class="muted">${esc(error.message)}</p></section>`;return}
 staffRecipeData=Array.isArray(data)?data:[];
 $('#status').textContent='● 직원 레시피 연결됨';renderStaffRecipes();
}
function renderStaffRecipes(){
 const v=$('#view');if(!v)return;
 v.innerHTML=`<section class="panel"><h2>일반 레시피</h2><p class="muted">조리용 재료와 사용량만 표시됩니다. 원가·구매가·비밀 배합은 표시되지 않습니다.</p>
 ${staffRecipeData.map(r=>`<div class="secret" style="margin:12px 0"><b>${esc(r.name)}</b>${(r.ingredients||[]).map(i=>`<p>${esc(i.name)} · ${esc(i.amount)} ${esc(i.unit||'')}</p>`).join('')||'<p class="muted">등록된 재료가 없습니다.</p>'}</div>`).join('')||'<div class="empty">등록된 일반 레시피가 없습니다.</div>'}</section>`;
}
async function check(){
 let {data:{user},error}=await supabase.auth.getUser();
 if(error||!user){$('#app').classList.add('hidden');$('#login').classList.remove('hidden');return}
 const p=await supabase.from('staff_profiles').select('role,active,secret_access').eq('user_id',user.id).maybeSingle();
 if(p.error||!p.data?.active||!['owner','manager','staff'].includes(p.data.role)){
  await supabase.auth.signOut();$('#loginMsg').textContent='사용 가능한 직원 계정이 아닙니다. 대표자에게 확인해 주세요.';
  $('#app').classList.add('hidden');$('#login').classList.remove('hidden');return
 }
 profile=p.data;currentUserId=user.id;
 $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
 if(profile.role==='owner'||profile.role==='manager'){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('hidden',(b.dataset.page==='access'&&profile.role!=='owner')||(b.dataset.page==='secret'&&!profile.secret_access&&profile.role!=='owner')));
  if(page==='access'&&profile.role!=='owner')page='dashboard';
  await load();if(profile.role==='owner')await fetchStaff();return;
 }
 // 일반 직원은 RPC만 사용하며 원가 데이터가 담긴 테이블을 요청하지 않습니다.
 page='staffrecipes';
 document.querySelectorAll('.nav').forEach(b=>b.classList.add('hidden'));
 $('#pageTitle').textContent='직원 레시피';
 await loadStaffRecipes();
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  $('#loginMsg').textContent='로그인 중...';
  const {error}=await supabase.auth.signInWithPassword({
    email:$('#email').value.trim(),
    password:$('#password').value
  });
  if(error){
    $('#loginMsg').textContent='오류: '+error.message+' | 코드: '+(error.code||'없음')+' | 상태: '+(error.status||'없음');
    return;
  }
  $('#password').value='';
  $('#loginMsg').textContent='';
  await check();
};
// GitHub Pages의 고정 주소. 사이트 게시 후 Supabase Authentication > URL Configuration에 등록해야 합니다.
const SITE_URL='https://jch79624053.github.io/chunghyeon/';
let recoveryMode=(location.hash.includes('type=recovery') || location.hash.includes('type=invite')) || ['recovery','invite'].includes(new URLSearchParams(location.search).get('type'));
function showRecovery(){recoveryMode=true;$('#app').classList.add('hidden');$('#login').classList.add('hidden');$('#recovery').classList.remove('hidden')}
$('#forgotBtn').onclick=()=>$('#forgotPanel').classList.toggle('hidden');
$('#sendReset').onclick=async()=>{
 const email=$('#email').value.trim(),msg=$('#resetRequestMsg');
 if(!email)return msg.textContent='먼저 이메일 주소를 입력해 주세요.';
 if(location.protocol==='file:'||location.protocol==='content:')return msg.textContent='GitHub Pages 사이트에서 접속한 뒤 요청해 주세요.';
 msg.textContent='이메일 전송 중...';
 const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});
 msg.textContent=error?('요청 오류: '+error.message):'재설정 이메일을 요청했습니다. 메일함을 확인해 주세요. (메일이 오지 않으면 잠시 후 확인하세요.)';
};
supabase.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery()});
if(recoveryMode)showRecovery();
$('#recoveryForm').onsubmit=async e=>{
 e.preventDefault();const pw=$('#newPassword').value,msg=$('#recoveryMsg');
 if(pw!==$('#confirmPassword').value)return msg.textContent='두 비밀번호가 일치하지 않습니다.';
 msg.textContent='변경 중...';
 const {error}=await supabase.auth.updateUser({password:pw});
 if(error)return msg.textContent='변경 실패: '+error.message;
 msg.textContent='비밀번호가 변경되었습니다. 로그인 화면으로 이동합니다.';
 await supabase.auth.signOut();history.replaceState(null,'',location.pathname);recoveryMode=false;
 $('#recovery').classList.add('hidden');$('#login').classList.remove('hidden');$('#loginMsg').textContent='새 비밀번호로 로그인해 주세요.';
};
$('#logout').onclick=async()=>{await supabase.auth.signOut();location.reload()};$('#reload').onclick=()=>profile?.role==='staff'?loadStaffRecipes():load();
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));if(page==='access'&&profile?.role==='owner')fetchStaff();$('#pageTitle').textContent={dashboard:'대시보드',materials:'원자재 관리',recipes:'레시피 관리',secret:'비밀 레시피',access:'직원 관리'}[page];render()});
function render(){if(profile?.role==='staff'){renderStaffRecipes();return}const v=$('#view');if(page==='dashboard'){let valid=recipes.filter(r=>recipeCost(r.id)!=null&&r.selling_price>0);let avg=valid.length?valid.reduce((a,r)=>a+recipeCost(r.id)/r.selling_price*100,0)/valid.length:0;v.innerHTML=`<div class="cards"><div class="card"><div class="muted">등록 원자재</div><div class="value">${materials.length}개</div></div><div class="card"><div class="muted">등록 메뉴</div><div class="value">${recipes.length}개</div></div><div class="card"><div class="muted">평균 재료 원가율</div><div class="value">${avg.toFixed(1)}%</div></div><div class="card"><div class="muted">가격 기록</div><div class="value">${history.length}건</div></div></div><div class="grid2"><section class="panel"><h2>월별 원자재 구매가 추이</h2><select id="trendSelect" class="secondary">${materials.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div id="trendChart"></div></section><section class="panel"><h2>메뉴별 원가율</h2>${recipes.map(r=>`<p><b>${esc(r.name)}</b> · ${recipeCost(r.id)==null||!r.selling_price?'확인 필요':(recipeCost(r.id)/r.selling_price*100).toFixed(1)+'%'}<br><span class="muted">원가 ${fmtCost(recipeCost(r.id))} / 판매가 ${won(r.selling_price)}</span></p>`).join('')||'<p class="muted">등록된 레시피가 없습니다.</p>'}</section></div><div class="note">실제 가격 자동 수집은 아직 연결되지 않았습니다. 온라인 상품 가격은 확인된 값만 수동 입력할 수 있습니다.</div>`;$('#trendSelect').onchange=e=>trend(+e.target.value);trend(+$('#trendSelect').value);return}
if(page==='materials'){v.innerHTML=`<section class="panel"><div class="bar"><h2>원자재 목록</h2><button class="primary" id="addMat">+ 원자재 추가</button></div><div id="editor"></div><div class="tablewrap"><table><thead><tr><th>원자재</th><th>구매처</th><th>구매가</th><th>포장 수량</th><th>단위당 가격</th><th>작업</th></tr></thead><tbody>${materials.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.vendor||'-')}</td><td>${m.purchase_price==null?'가격 확인 필요':won(m.purchase_price)}</td><td>${m.purchase_quantity??'-'}${esc(m.unit)}</td><td>${priceUnit(m)==null?'확인 필요':priceUnit(m).toFixed(2)+'원/'+(m.unit==='kg'?'g':m.unit==='L'?'ml':m.unit)}</td><td><button class="secondary editMat" data-id="${m.id}">수정</button> ${m.purchase_url?`<a target="_blank" rel="noopener noreferrer" href="${esc(m.purchase_url)}">구매 ↗</a>`:''}</td></tr>`).join('')}</tbody></table></div></section>`;$('#addMat').onclick=()=>matForm();document.querySelectorAll('.editMat').forEach(b=>b.onclick=()=>matForm(+b.dataset.id));return}
if(page==='recipes'){v.innerHTML=`<section class="panel"><div class="bar"><h2>메뉴별 레시피</h2><button class="primary" id="addRecipe">+ 레시피 추가</button></div><div id="editor"></div><div class="tablewrap"><table><thead><tr><th>메뉴</th><th>판매가</th><th>재료 원가</th><th>원가율</th><th>작업</th></tr></thead><tbody>${recipes.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${won(r.selling_price)}</td><td>${fmtCost(recipeCost(r.id))}</td><td>${recipeCost(r.id)==null||!r.selling_price?'확인 필요':(recipeCost(r.id)/r.selling_price*100).toFixed(1)+'%'}</td><td><button class="secondary editRecipe" data-id="${r.id}">수정</button></td></tr>`).join('')}</tbody></table></div></section>`;$('#addRecipe').onclick=()=>recipeForm();document.querySelectorAll('.editRecipe').forEach(b=>b.onclick=()=>recipeForm(+b.dataset.id));return}
if(page==='secret'){if(profile?.role!=='owner'&&!profile?.secret_access){v.innerHTML='<div class="note">비밀 레시피 접근 권한이 없습니다.</div>';return}v.innerHTML=`<section class="panel"><div class="bar"><h2>🔒 비밀 제조 레시피</h2><button class="primary" id="addSecret">+ 비밀 레시피 추가</button></div><div class="note">대표자 또는 승인된 관리자만 접근할 수 있습니다. 일반 직원은 비밀 배합을 조회하지 않습니다.</div><div id="editor"></div>${secrets.map(s=>`<div class="secret" style="margin:12px 0"><div class="bar"><b>${esc(s.name)}</b><button class="secondary editSecret" data-id="${s.id}">수정</button></div><p class="muted">생산량 ${s.yield_quantity}${esc(s.yield_unit)} · 배합 원가 ${fmtCost(secCost(s.id))}</p><div>${secretItems.filter(x=>x.secret_recipe_id===s.id).map(x=>`<p>${esc(materials.find(m=>m.id===x.material_id)?.name||'미등록')} · ${x.amount} (기본 사용 단위)</p>`).join('')}</div></div>`).join('')||'<div class="empty">등록된 비밀 레시피가 없습니다.</div>'}</section>`;$('#addSecret').onclick=()=>secretForm();document.querySelectorAll('.editSecret').forEach(b=>b.onclick=()=>secretForm(+b.dataset.id));return}
if(page==='access'){renderStaff();return}v.innerHTML=''}
// 직원 관리: 기존 대표자 로그인/인증 코드는 변경하지 않습니다.
let staffProfiles=[],staffError='';
async function fetchStaff(){
 const r=await supabase.from('staff_profiles').select('user_id,display_name,role,secret_access,active,created_at').order('created_at');
 staffError=r.error?.message||'';staffProfiles=r.data||[];
 if(page==='access')renderStaff();
}
function renderStaff(){
 const v=$('#view');if(!v)return;
 if(profile?.role!=='owner'){v.innerHTML='<div class="note">대표자만 직원 권한을 관리할 수 있습니다.</div>';return}
 v.innerHTML=`<section class="panel"><div class="bar"><h2>👥 직원 관리</h2><button type="button" class="secondary" id="refreshStaff">↻ 직원 목록 새로고침</button></div>
 <p class="muted">등록된 직원 프로필의 역할·비밀 레시피 승인·활성 상태를 관리합니다. 현재 로그인된 대표자 계정은 보호됩니다.</p>
 ${staffError?`<div class="note">직원 목록 조회 실패: ${esc(staffError)}</div>`:''}
 <div class="tablewrap"><table><thead><tr><th>직원명</th><th>권한</th><th>비밀 레시피 승인</th><th>계정 사용</th><th>저장</th></tr></thead><tbody>
 ${staffProfiles.map((u,i)=>{const self=u.user_id===currentUserId;return `<tr data-staff-index="${i}"><td><b>${esc(u.display_name||'이름 미등록')}</b>${self?' <span class="tag">현재 대표자</span>':''}<div class="muted">${esc(u.user_id.slice(0,8))}…</div></td>
 <td><select class="staff-role secondary" ${self?'disabled':''}><option value="owner" ${u.role==='owner'?'selected':''}>대표자</option><option value="manager" ${u.role==='manager'?'selected':''}>관리자</option><option value="staff" ${u.role==='staff'?'selected':''}>직원</option></select></td>
 <td><label><input type="checkbox" class="staff-secret" ${u.secret_access?'checked':''} ${self?'disabled':''}> 승인</label></td>
 <td><label><input type="checkbox" class="staff-active" ${u.active?'checked':''} ${self?'disabled':''}> 활성</label></td>
 <td>${self?'<span class="muted">보호됨</span>':`<button type="button" class="primary staff-save">저장</button>`}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">등록된 직원 프로필이 없습니다.</td></tr>'}
 </tbody></table></div><p id="staffMsg" class="muted" role="status"></p></section>
 <section class="panel"><h2>✉ 신규 직원 초대</h2><p class="muted">대표자만 초대할 수 있습니다. 직원에게 이메일이 발송되고, 직원은 초대 링크에서 비밀번호를 설정합니다.</p>
 <form id="inviteForm"><div class="formgrid"><label class="field">직원 이름<input name="name" maxlength="80" required placeholder="홍길동"></label><label class="field">직원 이메일<input name="email" type="email" required placeholder="staff@example.com"></label><label class="field">권한<select name="role"><option value="staff">직원</option><option value="manager">관리자</option></select></label></div>
 <div class="actions"><button class="primary" id="inviteBtn">초대 메일 보내기</button></div></form><p id="inviteMsg" class="muted" role="status"></p><div class="note">비밀 레시피 권한은 초대 후 직원 관리에서 대표자가 별도 승인합니다. Supabase Edge Function <b>invite-staff</b> 배포가 필요합니다.</div></section>`;
 $('#inviteForm').onsubmit=async e=>{
  e.preventDefault();const msg=$('#inviteMsg'),btn=$('#inviteBtn');
  const f=new FormData(e.target),name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim().toLowerCase(),role=String(f.get('role'));
  if(!name||!email||!['staff','manager'].includes(role))return msg.textContent='입력값을 확인해 주세요.';
  if(!confirm(`${name} (${email})에게 ${role==='manager'?'관리자':'직원'} 초대 메일을 보낼까요?`))return;
  btn.disabled=true;msg.textContent='초대 메일 전송 중...';
  try{
   const {data,error}=await supabase.functions.invoke('invite-staff',{body:{name,email,role}});
   if(error){let detail=error.message;try{const r=await error.context?.json();detail=r?.error||detail}catch{}throw new Error(detail)}
   if(!data?.ok)throw new Error(data?.error||'초대 처리 결과를 확인할 수 없습니다.');
   msg.textContent='초대 요청 완료. 직원 메일함을 확인해 주세요.';e.target.reset();await fetchStaff();
  }catch(err){msg.textContent='초대 실패: '+(err?.message||String(err))}finally{btn.disabled=false}
 };
 $('#refreshStaff').onclick=fetchStaff;
 document.querySelectorAll('.staff-save').forEach(btn=>btn.onclick=async()=>{
  const tr=btn.closest('tr'),u=staffProfiles[Number(tr.dataset.staffIndex)];
  if(!u||u.user_id===currentUserId)return;
  const role=tr.querySelector('.staff-role').value,secret_access=tr.querySelector('.staff-secret').checked,active=tr.querySelector('.staff-active').checked;
  if(role==='owner'){ $('#staffMsg').textContent='보안을 위해 이 화면에서는 대표자 권한을 새로 부여할 수 없습니다.';return}
  if(!confirm(`${u.display_name||'직원'}의 권한을 저장할까요?`))return;
  btn.disabled=true;$('#staffMsg').textContent='저장 중...';
  const res=await supabase.from('staff_profiles').update({role,secret_access,active}).eq('user_id',u.user_id).select('user_id').maybeSingle();
  if(res.error||!res.data){$('#staffMsg').textContent='저장 실패: '+(res.error?.message||'권한 또는 정책을 확인해 주세요.');btn.disabled=false;return}
  await fetchStaff();$('#staffMsg').textContent='직원 권한을 저장했습니다.';
 });
}
function trend(id){const el=$('#trendChart');if(!el)return;const m=materials.find(x=>x.id===id);if(!m){el.innerHTML='<p class="muted">원자재를 등록해 주세요.</p>';return}let by=new Map();history.filter(h=>h.material_id===id).sort((a,b)=>a.recorded_at.localeCompare(b.recorded_at)).forEach(h=>by.set(h.recorded_at.slice(0,7),Number(h.price)));let a=[...by].slice(-12);if(!a.length){el.innerHTML='<p class="muted">기록된 가격이 없습니다.</p>';return}let lo=Math.min(...a.map(x=>x[1])),hi=Math.max(...a.map(x=>x[1]));if(lo===hi){lo*=.8;hi*=1.2}let pts=a.map((x,i)=>({x:a.length===1?170:30+i*280/(a.length-1),y:150-(x[1]-lo)/(hi-lo)*110,label:x[0].slice(2),p:x[1]}));el.innerHTML=`<svg viewBox="0 0 340 190" style="width:100%;max-height:260px"><line x1="20" y1="150" x2="325" y2="150" stroke="#cbd5e1"/><polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#2563eb" stroke-width="3"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#2563eb"/><text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="10">${p.p.toLocaleString()}</text><text x="${p.x}" y="170" text-anchor="middle" font-size="10">${p.label}</text>`).join('')}</svg>`}
function matForm(id){const m=materials.find(x=>x.id===id)||{};$('#editor').innerHTML=`<div class="panel" style="background:#f8fbff"><h2>${id?'원자재 수정':'원자재 등록'}</h2><form id="matForm"><div class="formgrid"><label class="field">원자재 이름<input name="name" required value="${esc(m.name||'')}"></label><label class="field">구매처<input name="vendor" value="${esc(m.vendor||'')}"></label><label class="field">구매가(원) · 미확인 시 비우기<input name="price" type="number" min="0" step="0.01" value="${m.purchase_price??''}"></label><label class="field">포장 수량<input name="qty" type="number" min="0.001" step="any" value="${m.purchase_quantity??''}"></label><label class="field">단위<select name="unit">${['g','kg','ml','L','개'].map(u=>`<option ${m.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="field">구매 링크<input name="url" type="url" value="${esc(m.purchase_url||'')}"></label></div><div class="actions"><button class="primary">저장</button><button type="button" class="secondary" id="cancel">취소</button></div></form></div>`;$('#cancel').onclick=render;$('#matForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),p=f.get('price'),q=f.get('qty');const row={name:String(f.get('name')).trim(),vendor:String(f.get('vendor')).trim()||null,purchase_url:String(f.get('url')).trim()||null,purchase_price:p===''?null:Number(p),purchase_quantity:q===''?null:Number(q),unit:f.get('unit'),updated_at:new Date().toISOString()};if(row.purchase_price!=null&&!(row.purchase_quantity>0))return alert('구매가가 있으면 포장 수량도 입력해 주세요.');const res=id?await supabase.from('materials').update(row).eq('id',id).select().single():await supabase.from('materials').insert(row).select().single();if(res.error)return fail(res.error);if(row.purchase_price!=null&&(m.purchase_price==null||Number(m.purchase_price)!==row.purchase_price)){const h=await supabase.from('material_price_history').insert({material_id:res.data.id,price:row.purchase_price});if(h.error)fail(h.error)}await load()}}
function choiceOptions(selectedMat,selectedSecret){return `<option value="">재료 선택</option>${materials.map(m=>`<option value="m:${m.id}" ${selectedMat===m.id?'selected':''}>${esc(m.name)} (${m.unit==='kg'?'g':m.unit==='L'?'ml':m.unit})</option>`).join('')}${secrets.map(s=>`<option value="s:${s.id}" ${selectedSecret===s.id?'selected':''}>${esc(s.name)} · 제조 재료</option>`).join('')}`}
function rowHtml(x={},secret=false){return `<div class="ingrow"><select class="ingselect" required>${secret?`<option value="">원자재 선택</option>${materials.map(m=>`<option value="m:${m.id}" ${x.material_id===m.id?'selected':''}>${esc(m.name)} (${m.unit==='kg'?'g':m.unit==='L'?'ml':m.unit})</option>`).join('')}`:choiceOptions(x.material_id,x.secret_recipe_id)}</select><input class="amount" type="number" min="0.001" step="any" required placeholder="사용량" value="${x.amount??''}"><button type="button" class="secondary rm">삭제</button></div>`}
function wireRows(host,secret=false){host.querySelectorAll('.rm').forEach(b=>b.onclick=()=>b.closest('.ingrow').remove());const add=host.parentElement.querySelector('.addIng');if(add)add.onclick=()=>{host.insertAdjacentHTML('beforeend',rowHtml({},secret));wireRows(host,secret)}}
async function saveItems(table,parentField,parentId,rows,secret=false){const del=await supabase.from(table).delete().eq(parentField,parentId);if(del.error)throw del.error;if(rows.length){const data=rows.map(x=>secret?{secret_recipe_id:parentId,material_id:x.material_id,amount:x.amount}:{recipe_id:parentId,material_id:x.material_id,secret_recipe_id:x.secret_recipe_id,amount:x.amount});const ins=await supabase.from(table).insert(data);if(ins.error)throw ins.error}}
function collectRows(){return [...document.querySelectorAll('.ingrow')].map(el=>{const [type,id]=el.querySelector('select').value.split(':');return {material_id:type==='m'?Number(id):null,secret_recipe_id:type==='s'?Number(id):null,amount:Number(el.querySelector('.amount').value)}})}
function recipeForm(id){const r=recipes.find(x=>x.id===id)||{},ri=items.filter(x=>x.recipe_id===id);$('#editor').innerHTML=`<div class="panel" style="background:#f8fbff"><h2>${id?'레시피 수정':'레시피 추가'}</h2><form id="rForm"><div class="formgrid"><label class="field">메뉴 이름<input name="name" required value="${esc(r.name||'')}"></label><label class="field">판매가<input name="price" type="number" min="0" required value="${r.selling_price??''}"></label></div><h3>재료 및 사용량</h3><p class="muted">원자재는 g/ml/개, 비밀 제조 재료는 생산량 단위로 입력하세요.</p><div id="rows">${ri.map(x=>rowHtml(x)).join('')}</div><button class="secondary addIng" type="button">+ 재료 추가</button><div class="actions"><button class="primary">레시피 저장</button><button class="secondary" id="cancel" type="button">취소</button></div></form></div>`;wireRows($('#rows'));$('#cancel').onclick=render;$('#rForm').onsubmit=async e=>{e.preventDefault();let rows=collectRows();if(rows.some(x=>!(x.amount>0)||(!x.material_id&&!x.secret_recipe_id)))return alert('재료와 사용량을 확인해 주세요.');const f=new FormData(e.target),payload={name:String(f.get('name')).trim(),selling_price:Number(f.get('price'))};const res=id?await supabase.from('recipes').update(payload).eq('id',id).select().single():await supabase.from('recipes').insert(payload).select().single();if(res.error)return fail(res.error);try{await saveItems('recipe_items','recipe_id',res.data.id,rows)}catch(err){return fail(err)}await load()}}
function secretForm(id){const s=secrets.find(x=>x.id===id)||{},si=secretItems.filter(x=>x.secret_recipe_id===id);$('#editor').innerHTML=`<div class="panel" style="background:#f8fbff"><h2>${id?'비밀 레시피 수정':'비밀 레시피 추가'}</h2><form id="sForm"><div class="formgrid"><label class="field">제조 재료 이름<input name="name" required value="${esc(s.name||'')}"></label><label class="field">생산량<input name="yield" type="number" min="0.001" step="any" required value="${s.yield_quantity??''}"></label><label class="field">생산 단위<select name="unit">${['g','ml','개'].map(u=>`<option ${s.yield_unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div><h3>비밀 배합</h3><div id="rows">${si.map(x=>rowHtml(x,true)).join('')}</div><button class="secondary addIng" type="button">+ 재료 추가</button><div class="actions"><button class="primary">비밀 레시피 저장</button><button class="secondary" type="button" id="cancel">취소</button></div></form></div>`;wireRows($('#rows'),true);$('#cancel').onclick=render;$('#sForm').onsubmit=async e=>{e.preventDefault();const rows=collectRows();if(rows.some(x=>!x.material_id||!(x.amount>0)))return alert('재료와 사용량을 확인해 주세요.');const f=new FormData(e.target),payload={name:String(f.get('name')).trim(),yield_quantity:Number(f.get('yield')),yield_unit:f.get('unit')};const res=id?await supabase.from('secret_recipes').update(payload).eq('id',id).select().single():await supabase.from('secret_recipes').insert(payload).select().single();if(res.error)return fail(res.error);try{await saveItems('secret_recipe_items','secret_recipe_id',res.data.id,rows,true)}catch(err){return fail(err)}await load()}}
if(!recoveryMode)check();
</script></body></html>
